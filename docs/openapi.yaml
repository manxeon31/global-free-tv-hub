openapi: 3.1.0
info:
  title: Atlas proposed API (not implemented in static starter)
  version: 0.1.0
paths:
  /v1/channels:
    get:
      summary: Browse published channels
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: country, in: query, schema: {type: string, pattern: '^[A-Z]{2}$'}}
        - {name: language, in: query, schema: {type: string, pattern: '^[a-z]{3}$'}}
        - {name: category, in: query, schema: {type: string, maxLength: 40}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
      responses:
        '200':
          description: Published catalog page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, catalogVersion]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Channel'}}
                  nextCursor: {type: [string, 'null']}
                  catalogVersion: {type: string}
        '400': {description: Invalid query or cursor}
  /v1/playback/resolve:
    post:
      summary: Resolve authorized playback using trusted server territory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channelId]
              properties:
                channelId: {type: string, maxLength: 128}
                preferredLanguage: {type: string, pattern: '^[a-z]{3}$'}
      responses:
        '200':
          description: Playback or official-site fallback; private no-store response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [mode, url, reason, catalogVersion]
                    properties:
                      mode: {const: external}
                      url: {type: string, format: uri}
                      reason: {type: string, enum: [EXTERNAL_ONLY, RIGHTS_REVIEW_REQUIRED, REGION_UNCONFIRMED, UNAVAILABLE]}
                      catalogVersion: {type: string}
                  - type: object
                    required: [mode, url, expiresAt, feedId, catalogVersion]
                    properties:
                      mode: {const: hls}
                      url: {type: string, format: uri}
                      expiresAt: {type: string, format: date-time}
                      feedId: {type: string}
                      catalogVersion: {type: string}
        '400': {description: Invalid request}
        '404': {description: Channel not published}
        '429': {description: Rate limited}
  /v1/reports:
    post:
      summary: Submit a public-content-only channel report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channelId, category, message]
              properties:
                channelId: {type: string, maxLength: 128}
                category: {enum: [broken, rights, metadata]}
                message: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '202':
          description: Report queued
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference: {type: string}
        '400': {description: Invalid request}
        '429': {description: Rate limited}
components:
  schemas:
    Channel:
      type: object
      required: [id, name, country, languages, category, viewingMode]
      properties:
        id: {type: string}
        name: {type: string}
        country: {type: string}
        languages: {type: array, items: {type: string}}
        category: {type: string}
        viewingMode: {enum: [external, hls, official-embed]}
